# Automatic version cut (workflows/version-cut.md, step TAG):
# on every push to main, read the plugin version from plugin.json; if no release exists
# for it yet, create the tag agentic-dev/v<version> and a GitHub Release with generated
# notes. Bumping the version in plugin.json on main IS the release trigger — no manual
# tagging, no local push rights needed.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read plugin version
        id: v
        run: |
          v=$(python3 -c "import json;print(json.load(open('plugins/agentic-dev/.claude-plugin/plugin.json'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Create tag and release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="agentic-dev/v${{ steps.v.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "agentic-dev v${{ steps.v.outputs.version }}" \
            --generate-notes
