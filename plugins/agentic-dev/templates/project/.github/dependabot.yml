# TEMPLATE — copy to .github/dependabot.yml
# Patch and minor are grouped deliberately: one PR per week instead of eleven — reviewer
# attention is the scarce resource. Majors arrive alone and go through the full upgrade
# path (workflows/dependency-update.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
